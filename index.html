<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sihNavy: '#0c2340',
            sihBlue: '#1e3a5f',
            sihEmerald: '#059669',
            sihTeal: '#0d9488',
            sihCyan: '#0284c7',
            sihIndigo: '#4f46e5',
            sihViolet: '#7c3aed',
            sihAmber: '#d97706',
            sihRose: '#e11d48',
            sihSaffron: '#ea580c'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          animation: {
            fadeIn: 'fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            floatSlow: 'floatSlow 9s ease-in-out infinite',
            floatReverse: 'floatReverse 11s ease-in-out infinite',
            pulseSoft: 'pulseSoft 4s ease-in-out infinite',
            leafSway: 'leafSway 7s ease-in-out infinite',
            orbitSpin: 'orbitSpin 20s linear infinite',
            pulseFast: 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            bounceSlow: 'bounceSlow 6s ease-in-out infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0, transform: 'translateY(4px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' }
            },
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-18px) rotate(4deg)' }
            },
            floatReverse: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(16px) rotate(-4deg)' }
            },
            pulseSoft: {
              '0%, 100%': { opacity: 0.2, transform: 'scale(1)' },
              '50%': { opacity: 0.38, transform: 'scale(1.08)' }
            },
            leafSway: {
              '0%, 100%': { transform: 'rotate(-5deg) translateY(0)' },
              '50%': { transform: 'rotate(7deg) translateY(-10px)' }
            },
            orbitSpin: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' }
            },
            bounceSlow: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-12px)' }
            }
          }
        }
      }
    }
  </script>

    // =========================================================================
    function QuestionnaireModal({ roleKey, questions, onSkip, onComplete }) {
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const isComplete = questions.every(q => selectedAnswers[q.id] !== undefined);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border-t-4 border-emerald-600 overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-5 border-b border-slate-200 flex justify-between items-start bg-slate-50">
              <div>
                <span className="text-[10px] font-bold uppercase text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded border border-emerald-200">
                  NEW STUDENT CLINICAL EVALUATION (15 QUESTIONS)
                </span>
                <h3 className="text-base font-extrabold text-sihNavy mt-1">National Ayush Competency Diagnostic</h3>
                <p className="text-xs text-slate-500 mt-0.5">Answer the case questions to benchmark your profile readiness and CV ranking.</p>
              </div>
              <button 
                onClick={onSkip} 
                className="text-xs text-slate-600 hover:text-emerald-700 underline font-bold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200"
              >
                Skip Questionnaire &rarr;
              </button>
            </div>

            <div className="p-6 space-y-5 text-xs overflow-y-auto flex-1">
              {questions.map((q, idx) => (
                <div key={q.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                  <div className="flex justify-between items-center font-bold text-slate-800">
                    <span>Question {idx + 1} of {questions.length}</span>
                    <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">{q.category}</span>
                  </div>
                  <p className="font-semibold text-slate-700 leading-relaxed">{q.question}</p>
                  <div className="space-y-1.5 pt-1">
                    {q.options.map((opt, optIdx) => {
                      const isSel = selectedAnswers[q.id] === opt;
                      return (
                        <div
                          key={optIdx}
                          onClick={() => setSelectedAnswers({ ...selectedAnswers, [q.id]: opt })}
                          className={`p-2.5 rounded-lg border cursor-pointer transition flex items-center space-x-2 ${isSel ? 'bg-emerald-700 text-white border-emerald-700 font-semibold shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100'}`}
                        >
                          <span className="w-4 h-4 rounded-full border flex items-center justify-center text-[10px]">{String.fromCharCode(65 + optIdx)}</span>
                          <span>{opt}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>

            <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between">
              <button
                onClick={onSkip}
                className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs transition"
              >
                Skip Questionnaire &amp; Open Workspace
              </button>
              <button
                onClick={() => onComplete(selectedAnswers)}
                disabled={!isComplete}
                className="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-lg text-xs transition disabled:opacity-40 shadow"
              >
                Submit Evaluation ({Object.keys(selectedAnswers).length}/{questions.length}) &rarr;
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================

              <IconCheck className="w-4 h-4" />
              <span>Interview Pipeline &amp; Dispatches</span>
              <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${currentPage === 'pipeline' ? 'bg-cyan-950 text-white' : 'bg-slate-300 text-slate-700'}`}>
                {pipeline.length}
              </span>
            </button>
            <button
              onClick={() => setRecruiterPage('analytics')}
              className={`flex items-center space-x-2 px-4 py-2 rounded-xl transition ${
                currentPage === 'analytics'
                  ? 'bg-cyan-800 text-white shadow-sm font-extrabold'
                  : 'text-slate-700 hover:text-slate-900'
              }`}
            >
              <IconChart className="w-4 h-4" />
              <span>Talent Analytics &amp; Market Trends</span>
            </button>
          </div>

          {/* PAGE 1: DIRECTORY */}
          {currentPage === 'directory' && (
            <div className="space-y-4">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <div className="flex flex-wrap items-center gap-2 w-full">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => { setSearchQuery(e.target.value); setPageNumber(1); }}
                    placeholder="Search candidate name, institute, or skill..."
                    className="py-1.5 px-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 outline-none flex-1"
                  />
                  <select
                    value={filterStream}
                    onChange={(e) => { setFilterStream(e.target.value); setPageNumber(1); }}
                    className="py-1.5 px-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none"
                  >
                    <option value="ALL">All Disciplines</option>
                    {STREAMS.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>

                  <button
                    onClick={() => { setRecommendedOnly(!recommendedOnly); setPageNumber(1); }}
                    className={`py-1.5 px-3 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 border ${
                      recommendedOnly 
                        ? 'bg-amber-500 text-slate-950 font-black border-amber-600 shadow' 
                        : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200'
                    }`}
                  >
                    <span>★ Recommended (Best Clinical Benchmark)</span>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                {paginatedCandidates.map(c => {
                  const theme = STREAM_COLORS[c.stream] || STREAM_COLORS['Ayurveda (BAMS)'];
                  const isInvited = dispatchedInvites.includes(c.id);

                  return (
                    <div key={c.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between sih-card-hover">
                      <div>
                        <div className="flex items-start justify-between gap-3 mb-2.5">
                          <img src={c.avatar} alt={c.name} className="w-11 h-11 rounded-lg object-cover border border-slate-200" />
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${theme.bg} ${theme.text} border ${theme.border}`}>
                            {c.stream}
                          </span>
                        </div>
                        <div className="flex items-center justify-between">
                          <h4 className="text-xs font-bold text-slate-900">{c.name}</h4>
                          <span className="text-[10px] font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-1.5 py-0.2 rounded">
                            {c.matchScore}% Benchmark
                          </span>
                        </div>
                        <p className="text-[10px] font-mono text-slate-500 mt-0.5">{c.apaarId}</p>
                        <p className="text-[10px] text-slate-500 line-clamp-1 mt-0.5">{c.institute}</p>
                        <p className="text-xs text-emerald-800 font-bold mt-1.5">{c.hours} Hours Audited &bull; CGPA {c.cgpa}</p>

                        <div className="flex flex-wrap gap-1 mt-2.5">
                          {c.skills.map(s => (
                            <span key={s} className="text-[10px] bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded border border-slate-200 font-medium">
                              {s}
                            </span>
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={() => onDispatch(c)}
                        disabled={isInvited}
                        className={`mt-3 w-full py-1.5 rounded-lg text-xs font-bold transition shadow-sm ${isInvited ? 'bg-emerald-50 text-emerald-800 border border-emerald-300 font-black cursor-default' : 'bg-cyan-800 hover:bg-cyan-900 text-white'}`}
                      >
                        {isInvited ? 'Invite Dispatched ✓' : 'Dispatch Interview Call'}
                      </button>
                    </div>
                  );
                })}
              </div>

              {totalPages > 1 && (
                <div className="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
                  <span className="font-semibold text-slate-600">Page {pageNumber} of {totalPages}</span>
                  <div className="flex space-x-1">
                    <button
                      onClick={() => setPageNumber(p => Math.max(1, p - 1))}
                      disabled={pageNumber === 1}
                      className="px-2.5 py-1 border rounded bg-white font-medium disabled:opacity-40"
                    >
                      Prev
                    </button>
                    <button
                      onClick={() => setPageNumber(p => Math.min(totalPages, p + 1))}
                      disabled={pageNumber === totalPages}
                      className="px-2.5 py-1 border rounded bg-white font-medium disabled:opacity-40"
                    >
                      Next
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* PAGE 2: INTERVIEW PIPELINE */}
          {currentPage === 'pipeline' && (
            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4 text-xs">
              <h4 className="font-bold text-slate-900 uppercase tracking-wide">Interview Calls Dispatched via Ayush Samvad ({pipeline.length})</h4>
              <div className="divide-y divide-slate-100">
                {pipeline.map(inv => (
                  <div key={inv.id} className="py-3 flex justify-between items-center">
                    <div>
                      <h5 className="font-bold text-slate-900">{inv.candidate}</h5>
                      <p className="text-slate-500 text-[11px]">{inv.stream} &bull; Transmitted on {inv.sentOn}</p>
                    </div>
                    <span className="px-2.5 py-1 bg-emerald-100 text-emerald-900 border border-emerald-300 rounded font-semibold text-[11px]">
                      {inv.status}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* PAGE 3: TALENT ANALYTICS & MARKET TRENDS */}
          {currentPage === 'analytics' && (
            <div className="space-y-6">
              <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-5">
                <div className="border-b pb-3 flex justify-between items-center">
                  <div>
                    <h3 className="text-sm font-extrabold uppercase text-slate-900 tracking-wide">Corporate Talent Pool &amp; Stream Demand Analytics</h3>
                    <p className="text-xs text-slate-500">Real-time distribution of candidate availability and average practicum hours across sectors</p>
                  </div>
                  <span className="text-xs font-bold text-cyan-800 bg-cyan-100 px-3 py-1 rounded border border-cyan-300">
                    Live ATS Index
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                  <div className="space-y-3">
                    <span className="text-xs font-bold uppercase text-slate-700 block">Candidate Supply vs Corporate Quota Demand</span>
                    {[
                      { stream: 'Ayurveda (BAMS)', available: 840, required: 920, color: 'bg-emerald-600' },
                      { stream: 'Homeopathy (BHMS)', available: 520, required: 480, color: 'bg-sky-600' },
                      { stream: 'Yoga & Naturopathy (BNYS)', available: 390, required: 410, color: 'bg-amber-600' },
                      { stream: 'Unani (BUMS)', available: 210, required: 250, color: 'bg-teal-600' },
                      { stream: 'Siddha (BSMS)', available: 160, required: 180, color: 'bg-indigo-600' }
                    ].map(st => (
                      <div key={st.stream} className="space-y-1">
                        <div className="flex justify-between text-xs font-semibold text-slate-700">
                          <span>{st.stream}</span>
                          <span className="font-mono">{st.available} Registered &bull; {st.required} Openings</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                          <div className={`${st.color} h-full rounded-full`} style={{ width: `${Math.min(100, (st.available / 1000) * 100)}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="p-5 bg-slate-50 border border-slate-200 rounded-xl flex flex-col justify-between space-y-4">
                    <div>
                      <span className="text-xs font-bold uppercase text-slate-700 block mb-1">Recruitment Velocity &amp; Conversion</span>
                      <p className="text-xs text-slate-500">Average turnaround time from interview call dispatch to signed residency contract across industrial hubs.</p>
                    </div>
                    <div className="flex items-center justify-around py-3 bg-white rounded-lg border border-slate-200">
                      <div className="text-center">
                        <span className="text-2xl font-black text-cyan-800">4.2 Days</span>
                        <span className="text-[10px] font-bold uppercase text-slate-400 block">Avg. Time-to-Offer</span>
                      </div>
                      <div className="h-8 w-px bg-slate-200"></div>
                      <div className="text-center">
                        <span className="text-2xl font-black text-emerald-700">88.2%</span>
                        <span className="text-[10px] font-bold uppercase text-slate-400 block">Interview Acceptance</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="p-4 rounded-xl bg-cyan-50/50 border border-cyan-200 text-center space-y-1">
                    <span className="text-[11px] font-bold uppercase text-cyan-800">Top Hiring Hub</span>
                    <h4 className="text-xl font-black text-cyan-900">Delhi NCR / Noida</h4>
                    <p className="text-[10px] text-slate-500">42% of total placements</p>
                  </div>
                  <div className="p-4 rounded-xl bg-indigo-50/50 border border-indigo-200 text-center space-y-1">
                    <span className="text-[11px] font-bold uppercase text-indigo-800 block">Average Stipend</span>
                    <h4 className="text-xl font-black text-indigo-900">₹42,500 / mo</h4>
                    <p className="text-[10px] text-slate-500">Regulated by MoA Index</p>
                  </div>
                  <div className="p-4 rounded-xl bg-emerald-50/50 border border-emerald-200 text-center space-y-1">
                    <span className="text-[11px] font-bold uppercase text-emerald-800 block">Compliance Rate</span>
                    <h4 className="text-xl font-black text-emerald-900">100% APAAR</h4>
                    <p className="text-[10px] text-slate-500">Zero discrepancies</p>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // MOUNT TO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
